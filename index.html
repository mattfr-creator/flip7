        '</div>' +
      '</div>' +
      '<div class="hint">Reads the ' + o.live + ' cards nobody has flipped yet this round.</div>';
    }

    const statusBtns = [
      { k:'in', label:'Flipping', cls:'' },
      { k:'stayed', label:'Stayed', cls:'green' },
      { k:'frozen', label:'Frozen', cls:'blue' },
      { k:'busted', label:'Busted', cls:'red' }
    ].map(b => {
      const on = e.status === b.k || (b.k === 'stayed' && e.status === 'flip7');
      return '<button class="btn sm ' + (on ? b.cls : 'ghost') + '" data-a="setstatus" data-s="' + b.k + '" style="' + (on ? '' : 'opacity:.75') + '">' + b.label + '</button>';
    }).join('');

    const ids = g.playerIds;
    const i = ids.indexOf(pid);
    const prev = playerById(ids[(i - 1 + ids.length) % ids.length]);
    const next = playerById(ids[(i + 1) % ids.length]);

    return '<div class="grabber"></div>' +
      '<div class="sheet-h">' + avatarHTML(p) +
        '<div class="grow"><div class="nm" style="font-size:16px;font-weight:900">' + esc(p.name) + '</div>' +
        '<div class="meta">Total ' + liveTotal(g, pid) + ' · ' + Math.max(0, g.target - liveTotal(g, pid)) + ' to go</div></div>' +
        '<button class="iconbtn" data-a="closesheet" style="background:var(--surface-3);color:var(--ink);border-color:var(--line)" aria-label="Close">' + icon('close') + '</button>' +
      '</div>' +
      '<div class="sheet-b">' +
        '<div class="readout ' + (e.status === 'busted' ? 'bust' : sc.f7 ? 'f7' : '') + '">' +
          '<div class="big">' + sc.total + '</div>' +
          '<div class="grow"><div class="calc">' + (calc.length ? calc.map(esc).join('<br>') : 'No cards yet') + '</div></div>' +
          (sc.f7 ? '<span class="tag flip7">FLIP 7</span>' : '') +
        '</div>' +
        '<div class="statusrow">' + statusBtns + '</div>' +
        oddsHTML +
        (sc.f7 ? '<div class="hint" style="color:var(--purple);font-weight:800">Seven different cards — the round ends for everyone.</div>' : '') +
        giveHTML +
        (isManual ? '' :
          '<div class="sect-title" style="color:var(--ink-2)">Number cards <span style="opacity:.6;letter-spacing:.02em;text-transform:none">· corner = copies left</span></div>' +
          '<div class="cardgrid' + (V.numbers.length > 12 ? ' n13' : '') + '">' + numGrid + '</div>' +
          (specGrid ? '<div class="sect-title" style="color:var(--ink-2)">Special number cards</div>' +
                      '<div class="cardgrid specs">' + specGrid + '</div>' : '') +
          '<div class="sect-title" style="color:var(--ink-2)">Modifiers</div>' +
          '<div class="cardgrid mods">' + modGrid + '</div>' +
          '<div class="sect-title" style="color:var(--ink-2)">Action cards held</div>' +
          '<div class="cardgrid acts' + (V.acts.length > 3 ? ' five' : '') + '">' + actGrid + '</div>') +
        '<div class="hr"></div>' +
        (isManual
          ? '<div class="field"><label>Manual round total</label>' +
            '<div style="display:flex;gap:8px"><input class="input" id="manualin" inputmode="numeric" pattern="[0-9]*" value="' + esc(e.manual) + '" placeholder="0">' +
            '<button class="btn auto ghost" data-a="clearmanual" style="padding:13px 16px">Cards</button></div>' +
            '<div class="hint">Typing a total here replaces card-by-card scoring for this round. Tap <b>Cards</b> to go back.</div></div>'
          : '<div class="center"><button class="linkbtn" data-a="manual">Enter total manually</button>' +
            (cardCount(e) || e.mods.length || e.acts.length ? ' · <button class="linkbtn" data-a="clearline">Clear cards</button>' : '') +
            '</div>') +
      '</div>' +
      '<div class="sheet-f">' +
        '<button class="btn ghost auto navbtn" data-a="prevplayer" aria-label="Previous player">‹ ' + esc(initials(prev.name)) + '</button>' +
        '<button class="btn gold" data-a="closesheet">Done</button>' +
        '<button class="btn ghost auto navbtn" data-a="nextplayer" aria-label="Next player">' + esc(initials(next.name)) + ' ›</button>' +
      '</div>';
  }

  /* ---------------------------------------------------------
     13. MODALS
     --------------------------------------------------------- */
  function modalRoundSummary () {
    const g = S.game;
    const ri = g.roundIdx;
    const r = g.rounds[ri];
    const rs = roundScores(g, ri);
    const rows = g.playerIds.map(pid => {
      const sc = { total: rs[pid] };
      return { pid, p: playerById(pid), sc, tot: totalFor(g, pid, ri) };
    }).sort((a, b) => b.sc.total - a.sc.total);
    const bestRound = rows[0] ? rows[0].sc.total : 0;
    const st = standings(g);
    const reached = st[0] && st[0].total >= g.target;
    const tied = reached && st.length > 1 && st[1].total === st[0].total;
    const ends = reached && !tied;
    const nextDealer = playerById(g.playerIds[(g.dealerIdx + (S.settings.rotateDealer ? 1 : 0)) % g.playerIds.length]);
    const sub = ends ? esc(st[0].player.name) + ' reached ' + g.target
      : tied ? 'Tied at ' + st[0].total + ' — one more round'
      : 'Best round ' + bestRound + ' · ' + esc(nextDealer.name) + ' deals next';
    return '<div class="grabber"></div>' +
      '<div class="sheet-h"><div class="grow"><div class="nm" style="font-size:16px;font-weight:900">Round ' + (ri + 1) + ' scored</div>' +
      '<div class="meta">' + sub + '</div></div></div>' +
      '<div class="sheet-b">' + rows.map(r2 =>
        '<div class="row" style="padding-left:0;padding-right:0">' + avatarHTML(r2.p) +
        '<div class="grow"><div class="nm">' + esc(r2.p.name) + '</div>' +
          '<div class="linecards" style="margin-top:3px">' + (miniCards(r.entries[r2.pid] || newEntry(), variantOf(g)) || '<span class="meta" style="margin:0">No cards</span>') + '</div></div>' +
        '<div class="score-pill" style="' + (r2.sc.total === 0 ? 'color:var(--red)' : r2.sc.total === bestRound && bestRound > 0 ? 'color:var(--green)' : '') + '"><span class="lbl">Round</span>' + (r2.sc.total > 0 ? '+' : '') + r2.sc.total + '</div>' +
        '<div class="score-pill"><span class="lbl">Total</span>' + r2.tot + '</div></div>').join('') +
      '</div>' +
      '<div class="sheet-f"><button class="btn ghost auto" data-a="undoround" style="flex:0 0 auto;padding:14px 15px">Undo</button>' +
      '<button class="btn gold" data-a="nextround">' + (ends ? 'See the result' : tied ? 'Tiebreak round' : 'Start round ' + (ri + 2)) + '</button></div>';
  }

  function modalConfirm (o) {
    return '<div class="sheet-h" style="border:0;padding-top:16px"><div class="grow"><div class="nm" style="font-size:17px;font-weight:900">' + esc(o.title) + '</div></div></div>' +
      '<div class="sheet-b" style="padding-top:0"><div class="prose">' + o.body + '</div></div>' +
      '<div class="sheet-f"><button class="btn ghost" data-a="closesheet">' + esc(o.cancel || 'Cancel') + '</button>' +
      '<button class="btn ' + (o.danger ? 'red' : 'gold') + '" data-a="confirm">' + esc(o.ok || 'OK') + '</button></div>';
  }

  /* ---------------------------------------------------------
     14. RENDER
     --------------------------------------------------------- */
  function render () {
    try { renderInner(); }
    catch (err) {
      // Never leave the user staring at an empty background: show a screen
      // they can actually recover from.
      try { renderRecovery(err); } catch (e2) {
        document.getElementById('app').innerHTML =
          '<div style="padding:40px 20px;color:#fff;font-family:sans-serif">' +
          '<h2>Flip 7 could not start</h2><p>Add <b>#reset</b> to the end of the address and reload to clear saved data.</p></div>';
      }
    }
  }

  function renderInner () {
    document.documentElement.setAttribute('data-theme', S.settings.theme);
    const app = $('#app');
    const scrollEl = $('.body');
    const y = scrollEl ? scrollEl.scrollTop : 0;
    let html = '';
    switch (route) {
      case 'game': html = viewGame(); break;
      case 'sheetview': html = viewSheetView(); break;
      case 'stats': html = viewStats(); break;
      case 'rules': html = viewRules(); break;
      case 'settings': html = viewSettings(); break;
      case 'history': html = viewHistory(); break;
      case 'recovery': html = viewRecovery(lastError); break;
      default: html = viewHome();
    }
    app.innerHTML = html;
    const nb = $('.body');
    if (nb && route === lastRoute) nb.scrollTop = y;
    lastRoute = route;
    renderSheet();
  }
  let lastRoute = null;
  let lastError = null;

  function renderRecovery (err) {
    lastError = err;
    route = 'recovery';
    document.documentElement.setAttribute('data-theme', 'table');
    $('#app').innerHTML = viewRecovery(err);
    $('#sheet-root').innerHTML = '';
    sheet = null;
  }

  function viewRecovery (err) {
    const msg = err && err.message ? err.message : String(err || 'Unknown problem');
    return '<div class="screen">' +
      '<div class="topbar"><div class="grow"><h1>Something broke</h1>' +
        '<div class="sub">Your players and history are safe</div></div></div>' +
      '<div class="body">' +
        '<div class="panel"><div class="panel-h">What happened</div><div class="panel-b prose">' +
          '<p>Flip 7 could not draw this screen from the saved data. Nothing has been deleted — pick a way out below.</p>' +
          '<p style="font-size:11.5px;color:var(--ink-3);word-break:break-word">' + esc(msg) + '</p>' +
        '</div></div>' +
        '<div class="panel mt"><div class="panel-b">' +
          '<button class="btn wide" data-a="rec-home" style="margin-bottom:9px">Go to the start screen</button>' +
          '<button class="btn ghost wide" data-a="rec-drop" style="margin-bottom:9px">Drop the current game, keep players &amp; history</button>' +
          '<button class="btn ghost wide" data-a="rec-wipe" style="color:var(--red)">Erase everything and start clean</button>' +
        '</div></div>' +
        '<div class="hint center" style="color:rgba(255,255,255,.9)">You can also add <b>#reset</b> to the end of the address and reload.</div>' +
      '</div>' +
    '</div>';
  }

  function renderSheet () {
    const root = $('#sheet-root');
    if (!sheet) { root.innerHTML = ''; return; }
    let inner = '', cls = 'sheet';
    if (sheet.type === 'entry') inner = sheetEntryHTML(sheet.pid);
    else if (sheet.type === 'summary') inner = modalRoundSummary();
    else if (sheet.type === 'confirm') { inner = modalConfirm(sheet); cls = 'modal'; }
    const existing = $('#sheet-root .' + (cls === 'modal' ? 'modal' : 'sheet'));
    if (existing && sheet._mounted) {
      existing.innerHTML = inner;
    } else {
      root.innerHTML = '<div class="scrim" data-a="closesheet"></div><div class="' + cls + '">' + inner + '</div>';
      requestAnimationFrame(() => {
        const sc = $('#sheet-root .scrim'); const sh = $('#sheet-root .' + (cls === 'modal' ? 'modal' : 'sheet'));
        if (sc) sc.classList.add('on'); if (sh) sh.classList.add('on');
      });
      sheet._mounted = true;
    }
  }

  function closeSheet () {
    // tidy up an empty manual entry so the row does not read as "Manual entry"
    if (sheet && sheet.type === 'entry' && S.game) {
      const e = entryOf(S.game, S.game.roundIdx, sheet.pid);
      if (e && e.manual === '' && !cardCount(e) && !e.mods.length && !e.acts.length) {
        e.manual = null;
        if (e.status === 'stayed') e.status = 'in';
        save();
      }
    }
    const sc = $('#sheet-root .scrim'); const sh = $('#sheet-root .sheet, #sheet-root .modal');
    if (sc) sc.classList.remove('on'); if (sh) sh.classList.remove('on');
    sheet = null;
    setTimeout(() => { if (!sheet) $('#sheet-root').innerHTML = ''; }, 240);
    render();
  }

  function openSheet (o) { sheet = o; renderSheet(); }

  /* ---------------------------------------------------------
     15. ACTIONS
     --------------------------------------------------------- */
  function ensureRoster (name) {
    const p = { id: uid(), name: name, color: PALETTE[S.roster.length % PALETTE.length] };
    S.roster.push(p);
    return p;
  }

  function startGame () {
    const ids = S.selected.filter(id => S.roster.some(p => p.id === id));
    if (ids.length < 2) return;
    if (S.game && S.game.over) S.history.push(JSON.parse(JSON.stringify(S.game)));
    else if (S.game) {
      openSheet({
        type:'confirm', title:'Start a new game?', danger:true, ok:'Start new',
        body:'<p>The game in progress will be discarded.</p>',
        onConfirm: () => { S.game = null; closeSheet(); setTimeout(startGame, 60); }
      });
      return;
    }
    S.game = newGame(ids, S.settings.target, setupVariant().id, S.settings.brutal);
    undoStack = [];
    route = 'game'; save(); render();
    toast('Round 1 — ' + playerById(ids[0]).name + ' deals');
  }

  function endRound (force) {
    const g = S.game;
    const left = unresolved(g);
    if (left.length && !force) {
      openSheet({
        type:'confirm', title:'Finish the round?',
        body:'<p>' + left.length + ' player' + (left.length > 1 ? 's are' : ' is') + ' still marked as flipping: <b>' +
             left.map(id => esc(playerById(id).name)).join(', ') + '</b>.</p><p>They will be banked as <b>Stayed</b> with the cards recorded.</p>',
        ok:'Bank & score', onConfirm: () => { closeSheet(); endRound(true); }
      });
      return;
    }
    snapshot('score round ' + (g.roundIdx + 1));
    const r = currentRound(g);
    g.playerIds.forEach(pid => {
      const e = entryOf(g, g.roundIdx, pid);
      if (e.status === 'in') e.status = cardCount(e) >= FLIP7_NUMS ? 'flip7' : 'stayed';
    });
    r.done = true;
    save();
    openSheet({ type:'summary' });
    buzz(14);
  }

  function nextRound () {
    const g = S.game;
    closeSheet();
    // win check
    const st = standings(g);
    if (st[0] && st[0].total >= g.target) {
      if (st.length > 1 && st[1].total === st[0].total) {
        g.roundIdx++;
        g.rounds.push({ entries:{}, done:false });
        if (S.settings.rotateDealer) g.dealerIdx++;
        save(); render();
        toast('Tie at ' + st[0].total + ' — playing a tiebreak round');
        return;
      }
      g.over = true; g.winnerId = st[0].pid; g.endedAt = Date.now();
      save(); render(); confetti();
      return;
    }
    g.roundIdx++;
    g.rounds.push({ entries:{}, done:false });
    if (S.settings.rotateDealer) g.dealerIdx++;
    save(); render();
    const dealer = playerById(g.playerIds[g.dealerIdx % g.playerIds.length]);
    toast('Round ' + (g.roundIdx + 1) + ' — ' + dealer.name + ' deals');
  }

  function finishGame () {
    const g = S.game;
    if (g) { S.history.push(JSON.parse(JSON.stringify(g))); }
    S.game = null; undoStack = [];
    route = 'home'; saveNow(); render();
    toast('Game saved to history');
  }

  function rematch () {
    const g = S.game;
    const ids = g.playerIds.slice();
    S.history.push(JSON.parse(JSON.stringify(g)));
    // loser deals first next game
    const st = standings(g);
    const order = ids.slice();
    S.game = newGame(order, g.target, g.variant, g.brutal);
    S.game.dealerIdx = order.indexOf(st[st.length - 1].pid);
    undoStack = [];
    route = 'game'; saveNow(); render();
    toast('Rematch! ' + playerById(S.game.playerIds[S.game.dealerIdx]).name + ' deals');
  }

  function confetti () {
    const wrap = document.createElement('div');
    wrap.className = 'confetti';
    for (let i = 0; i < 70; i++) {
      const c = document.createElement('i');
      c.style.left = Math.random() * 100 + '%';
      c.style.top = (-10 - Math.random() * 30) + 'vh';
      c.style.background = PALETTE[i % PALETTE.length];
      c.style.animationDuration = (1.7 + Math.random() * 1.6) + 's';
      c.style.animationDelay = (Math.random() * .5) + 's';
      wrap.appendChild(c);
    }
    document.body.appendChild(wrap);
    setTimeout(() => wrap.remove(), 4200);
  }

  function checkFlip7 (e) {
    if (cardCount(e) < FLIP7_NUMS) return;
    e.status = 'flip7'; buzz(30);
    toast('FLIP 7! The round ends for everyone', 'Score round', () => { closeSheet(); setTimeout(() => endRound(true), 260); });
  }

  function cycleSheetPlayer (dir) {
    const g = S.game;
    const i = g.playerIds.indexOf(sheet.pid);
    const n = (i + dir + g.playerIds.length) % g.playerIds.length;
    sheet.pid = g.playerIds[n];
    renderSheet();
  }

  /* ---------------------------------------------------------
     16. EVENT DISPATCH
     --------------------------------------------------------- */
  document.addEventListener('click', function (ev) {
    try { dispatch(ev); }
    catch (err) {
      toast('That did not work — the screen has been reset');
      try { route = (S.game && !S.game.over) ? 'game' : 'home'; sheet = null; renderInner(); }
      catch (e2) { renderRecovery(err); }
    }
  });

  function dispatch (ev) {
    const t = ev.target.closest('[data-a]');
    if (!t) return;
    const a = t.getAttribute('data-a');
    const g = S.game;

    if (a === 'rec-home') { route = 'home'; sheet = null; render(); return; }
    if (a === 'rec-drop') { S.game = null; undoStack = []; saveNow(); route = 'home'; sheet = null; render(); toast('Current game removed'); return; }
    if (a === 'rec-wipe') { S = DEFAULTS(); undoStack = []; saveNow(); route = 'home'; sheet = null; render(); toast('All data erased'); return; }

    // navigation
    if (a.indexOf('go:') === 0) {
      const dest = a.slice(3);
      if (dest === 'back') { route = backStack.pop() || (S.game && !S.game.over ? 'game' : 'home'); }
      else { if (dest !== route) backStack.push(route); route = dest; }
      if (backStack.length > 12) backStack.shift();
      render(); return;
    }

    switch (a) {
      /* --- home --- */
      case 'addplayer': {
        const el = $('#newname');
        const v = (el ? el.value : '').trim();
        if (!v) { el && el.focus(); return; }
        if (S.roster.length >= 18) { toast('18 players is the limit'); return; }
        const p = ensureRoster(v);
        S.selected.push(p.id);
        nameDraft = '';
        save(); render();
        setTimeout(() => { const n = $('#newname'); if (n) n.focus(); }, 30);
        break;
      }
      case 'delplayer': {
        ev.stopPropagation();
        const id = t.getAttribute('data-id');
        openSheet({
          type:'confirm', title:'Remove ' + playerById(id).name + '?',
          body:'<p>Their saved stats and history stay, but they are removed from the player list.</p>',
          ok:'Remove', danger:true,
          onConfirm: () => {
            S.roster = S.roster.filter(p => p.id !== id);
            S.selected = S.selected.filter(x => x !== id);
            save(); closeSheet();
          }
        });
        break;
      }
      case 'togglesel': {
        const id = t.getAttribute('data-id');
        const i = S.selected.indexOf(id);
        if (i >= 0) S.selected.splice(i, 1); else S.selected.push(id);
        buzz(6); save(); render(); break;
      }
      case 'selall': S.selected = S.roster.map(p => p.id); save(); render(); break;
      case 'selnone': S.selected = []; save(); render(); break;
      case 'target': S.settings.target = Number(t.getAttribute('data-t')); save(); render(); break;
      case 'entrymode': S.settings.entryMode = t.getAttribute('data-t'); save(); render(); break;
      case 'variant': S.settings.variant = t.getAttribute('data-t'); save(); render(); break;
      case 'deckreset': S.settings.deckOverride = {}; save(); render(); toast('Deck counts reset'); break;
      case 'startgame': startGame(); break;
      case 'resume': route = 'game'; render(); break;
      case 'discard':
        openSheet({
          type:'confirm', title:'Discard this game?', danger:true, ok:'Discard',
          body:'<p>The game in progress will be deleted without being saved to history.</p>',
          onConfirm: () => { S.game = null; undoStack = []; saveNow(); closeSheet(); toast('Game discarded'); }
        });
        break;

      /* --- game --- */
      case 'openentry': {
        const pid = t.getAttribute('data-id');
        const e = entryOf(g, g.roundIdx, pid);
        if (S.settings.entryMode === 'totals' && e.manual === null && !cardCount(e) && !e.mods.length) e.manual = '';
        openSheet({ type:'entry', pid: pid });
        if (S.settings.entryMode === 'totals') setTimeout(() => { const m = $('#manualin'); if (m) { m.focus(); m.select(); } }, 320);
        break;
      }
      case 'cyclestatus': {
        ev.stopPropagation();
        const pid = t.getAttribute('data-id');
        const e = entryOf(g, g.roundIdx, pid);
        const order = ['in', 'stayed', 'busted', 'frozen'];
        let i = order.indexOf(e.status === 'flip7' ? 'stayed' : e.status);
        const next = order[(i + 1) % order.length];
        e.status = (next === 'stayed' && e.nums.length >= FLIP7_NUMS) ? 'flip7' : next;
        buzz(8); save(); render();
        break;
      }
      case 'closesheet': closeSheet(); break;
      case 'confirm': if (sheet && sheet.onConfirm) sheet.onConfirm(); else closeSheet(); render(); break;
      case 'undo': undo(); break;
      case 'endround': endRound(false); break;
      case 'nextround': nextRound(); break;
      case 'undoround': closeSheet(); undo(); break;
      case 'finishgame': finishGame(); break;
      case 'rematch': rematch(); break;

      /* --- entry sheet --- */
      case 'tnum': {
        const n = Number(t.getAttribute('data-n'));
        const e = entryOf(g, g.roundIdx, sheet.pid);
        const i = e.nums.indexOf(n);
        if (i >= 0) e.nums.splice(i, 1);
        else {
          if (cardCount(e) >= FLIP7_NUMS) { toast('Seven cards is the maximum'); return; }
          e.nums.push(n);
          checkFlip7(e);
        }
        e.manual = null;
        buzz(8); save(); renderSheet(); break;
      }
      case 'tspec': {
        const x = t.getAttribute('data-x');
        const V = variantOf(g);
        const e = entryOf(g, g.roundIdx, sheet.pid);
        if (!Array.isArray(e.specials)) e.specials = [];
        const i = e.specials.indexOf(x);
        if (i >= 0) e.specials.splice(i, 1);
        else {
          if (cardCount(e) >= FLIP7_NUMS) { toast('Seven cards is the maximum'); return; }
          if (x === 'unlucky' && (e.nums.length || e.mods.length || e.specials.length)) {
            // Unlucky 7 bins everything already in front of you.
            snapshot('Unlucky 7');
            e.nums = []; e.mods = []; e.specials = [];
            toast('Unlucky 7 — cleared the rest of the line', 'Undo', undo);
          }
          e.specials.push(x);
          checkFlip7(e);
        }
        e.manual = null;
        buzz(12); save(); renderSheet(); break;
      }
      case 'f7keep': {
        const e = entryOf(g, g.roundIdx, sheet.pid);
        e.f7give = null; buzz(8); save(); renderSheet(); break;
      }
      case 'f7give': {
        const e = entryOf(g, g.roundIdx, sheet.pid);
        const id = t.getAttribute('data-id');
        e.f7give = (e.f7give === id) ? null : id;
        buzz(12); save(); renderSheet(); break;
      }
      case 'tmod': {
        const m = t.getAttribute('data-m');
        const e = entryOf(g, g.roundIdx, sheet.pid);
        const i = e.mods.indexOf(m);
        if (i >= 0) e.mods.splice(i, 1); else e.mods.push(m);
        e.manual = null; buzz(8); save(); renderSheet(); break;
      }
      case 'tact': {
        const x = t.getAttribute('data-x');
        const e = entryOf(g, g.roundIdx, sheet.pid);
        const i = e.acts.indexOf(x);
        if (i >= 0) e.acts.splice(i, 1);
        else {
          e.acts.push(x);
          if (x === 'freeze') e.status = 'frozen';
        }
        buzz(8); save(); renderSheet(); break;
      }
      case 'setstatus': {
        const s = t.getAttribute('data-s');
        const e = entryOf(g, g.roundIdx, sheet.pid);
        e.status = (s === 'stayed' && cardCount(e) >= FLIP7_NUMS) ? 'flip7' : s;
        buzz(10); save(); renderSheet();
        if (s !== 'in' && S.settings.autoAdvance) {
          const from = g.playerIds.indexOf(sheet.pid);
          let nextPid = null;
          for (let k = 1; k <= g.playerIds.length; k++) {
            const cand = g.playerIds[(from + k) % g.playerIds.length];
            if (entryOf(g, g.roundIdx, cand).status === 'in') { nextPid = cand; break; }
          }
          setTimeout(() => {
            if (!sheet || sheet.type !== 'entry') return;
            if (nextPid) { sheet.pid = nextPid; renderSheet(); }
            else closeSheet();
          }, 420);
        }
        break;
      }
      case 'cycledealer': {
        ev.stopPropagation();
        g.dealerIdx = (g.dealerIdx + 1) % g.playerIds.length;
        save(); render();
        toast(playerById(g.playerIds[g.dealerIdx]).name + ' deals');
        break;
      }
      case 'manual': {
        const e = entryOf(g, g.roundIdx, sheet.pid);
        e.manual = String(scoreEntry(e, variantOf(g), { brutal: g.brutal }).total);
        save(); renderSheet();
        setTimeout(() => { const m = $('#manualin'); if (m) { m.focus(); m.select(); } }, 40);
        break;
      }
      case 'clearmanual': {
        const e = entryOf(g, g.roundIdx, sheet.pid);
        e.manual = null; save(); renderSheet(); break;
      }
      case 'clearline': {
        const e = entryOf(g, g.roundIdx, sheet.pid);
        e.nums = []; e.mods = []; e.acts = []; e.specials = []; e.status = 'in'; e.manual = null; e.f7give = null;
        save(); renderSheet(); break;
      }
      case 'prevplayer': cycleSheetPlayer(-1); break;
      case 'nextplayer': cycleSheetPlayer(1); break;

      /* --- settings --- */
      case 'toggle': {
        const k = t.getAttribute('data-k');
        S.settings[k] = !S.settings[k]; save(); render(); break;
      }
      case 'theme': S.settings.theme = t.getAttribute('data-t'); save(); render(); break;
      case 'resetdata':
        openSheet({
          type:'confirm', title:'Erase everything?', danger:true, ok:'Erase',
          body:'<p>Players, stats, history and the current game are all deleted. This cannot be undone.</p>',
          onConfirm: () => { S = DEFAULTS(); undoStack = []; saveNow(); route = 'home'; closeSheet(); toast('All data erased'); }
        });
        break;
      case 'export': {
        try {
          const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url; link.download = 'flip7-backup.json'; link.click();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
          toast('Backup downloaded');
        } catch (e2) { toast('Export not available here'); }
        break;
      }
      case 'share': {
        const st = standings(g);
        const done = g.rounds.filter(r => isObj(r) && r.done).length;
        const text = 'Flip 7 — first to ' + g.target + '\n' +
          st.map((s, i) => (i + 1) + '. ' + s.player.name + ' — ' + s.total).join('\n') +
          '\n' + done + ' rounds';
        if (navigator.share) {
          navigator.share({ title: 'Flip 7 result', text: text }).catch(() => {});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => toast('Result copied')).catch(() => toast('Could not copy'));
        } else toast('Sharing not available here');
        break;
      }
      case 'delhistory': {
        const id = t.getAttribute('data-id');
        S.history = S.history.filter(x => x.id !== id);
        save(); render(); toast('Game deleted'); break;
      }
    }
  }

  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'manualin') {
      const g = S.game; if (!sheet || sheet.type !== 'entry') return;
      const e = entryOf(g, g.roundIdx, sheet.pid);
      const v = ev.target.value.replace(/[^0-9-]/g, '');
      e.manual = v;
      if (e.status === 'in') e.status = 'stayed';
      const ro = $('#sheet-root .readout .big');
      if (ro) ro.textContent = scoreEntry(e, variantOf(g), { brutal: g.brutal }).total;
      save();
    }
    if (ev.target.id === 'newname') nameDraft = ev.target.value;
    if (ev.target.getAttribute && ev.target.getAttribute('data-deck')) {
      const n = ev.target.getAttribute('data-deck');
      const v = Math.max(0, Math.min(20, Math.floor(num(ev.target.value, 0))));
      if (!isObj(S.settings.deckOverride)) S.settings.deckOverride = {};
      if (!isObj(S.settings.deckOverride.vengeance)) S.settings.deckOverride.vengeance = {};
      S.settings.deckOverride.vengeance[n] = v;
      const el = $('#decksum');
      if (el) { el.textContent = deckSumLabel(); el.style.color = deckSum() === VARIANTS.vengeance.deckTotal ? 'var(--green)' : 'var(--red)'; }
      save();
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.id === 'newname') {
      ev.preventDefault();
      const b = document.querySelector('[data-a="addplayer"]'); b && b.click();
    }
    if (ev.key === 'Enter' && ev.target.id === 'manualin') {
      ev.preventDefault();
      const g = S.game;
      if (!g || !sheet || sheet.type !== 'entry') return;
      const from = g.playerIds.indexOf(sheet.pid);
      let nextPid = null;
      for (let k = 1; k <= g.playerIds.length; k++) {
        const cand = g.playerIds[(from + k) % g.playerIds.length];
        const e = entryOf(g, g.roundIdx, cand);
        if (e.status === 'in' && e.manual === null) { nextPid = cand; break; }
      }
      if (!nextPid) { closeSheet(); return; }
      const e2 = entryOf(g, g.roundIdx, nextPid);
      if (S.settings.entryMode === 'totals' && e2.manual === null && !e2.nums.length) e2.manual = '';
      sheet.pid = nextPid; renderSheet();
      setTimeout(() => { const m = $('#manualin'); if (m) { m.focus(); m.select(); } }, 30);
    }
    if (ev.key === 'Escape' && sheet) closeSheet();
  });

  /* ---------------------------------------------------------
     17. BOOT
     --------------------------------------------------------- */
  // Escape hatch: <url>#reset clears saved data before anything is read.
  if (String(location.hash || '').toLowerCase().indexOf('reset') >= 0) {
    try { localStorage.removeItem(KEY); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }

  try { S = load(); } catch (e) { S = DEFAULTS(); }
  if (S.game && !S.game.over) route = 'game';
  render();
  window.addEventListener('error', function (ev) {
    // If the app never managed to draw a screen, surface a recovery view.
    if (!document.querySelector('#app .screen')) renderRecovery(ev.error || new Error(ev.message));
  });
  // Offline support, but only when actually served over http(s) — opening the
  // file directly has no origin to register against.
  if (window.FLIP7_SW && 'serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    try { navigator.serviceWorker.register('./sw.js').catch(function () {}); } catch (e) {}
  }

  window.addEventListener('beforeunload', saveNow);
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });

  // expose a small surface for automated testing
  window.__flip7 = {
    get state () { return S; },
    scoreEntry, oddsFor, standings, roundScores, variants: VARIANTS, cardCount,
    goto: r => { route = r; render(); },
    reset: () => { S = DEFAULTS(); undoStack = []; saveNow(); route = 'home'; sheet = null; render(); }
  };
})();
</script>
</body>
</html>
